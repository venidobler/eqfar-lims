{% extends 'base.html' %}

{% block content %}
<div class="max-w-7xl mx-auto mt-8 px-4 sm:px-6 lg:px-8">

    <div class="md:flex md:items-center md:justify-between mb-6">
        <div class="flex-1 min-w-0">
            <h2 class="text-2xl font-bold leading-7 text-gray-900 sm:text-3xl sm:truncate">
                Dashboard de Ocupação 📊
            </h2>
            <p class="mt-1 text-sm text-gray-500">
                Visualize e gerencie a alocação dos equipamentos do laboratório.
            </p>
        </div>

        <div
            class="mt-4 flex md:mt-0 gap-4 text-sm font-medium text-gray-600 bg-white px-4 py-2 rounded-lg shadow-sm border border-gray-200">
            <div class="flex items-center gap-2">
                <div class="w-4 h-4 rounded bg-blue-600"></div>
                Minhas Reservas
            </div>
            <div class="flex items-center gap-2">
                <div class="w-4 h-4 rounded bg-gray-400"></div>
                Outros Pesquisadores
            </div>
        </div>
    </div>

    <div class="bg-white shadow rounded-lg p-4 border border-gray-200">
        <div id="gantt-container" style="height: 600px; width: 100%;"></div>
    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/highcharts@11/highcharts-gantt.js"></script>
<script src="https://cdn.jsdelivr.net/npm/highcharts@11/modules/exporting.js"></script>

<script id="categories-data" type="application/json">{{ y_categories|safe }}</script>
<script id="series-data" type="application/json">{{ series_data|safe }}</script>

<script>
    document.addEventListener('DOMContentLoaded', function () {

        // 1. Lendo os dados com segurança
        const categoriesText = document.getElementById('categories-data').textContent;
        const seriesText = document.getElementById('series-data').textContent;

        // Converte os textos em objetos JavaScript de verdade
        const yCategories = categoriesText ? JSON.parse(categoriesText) : [];
        const seriesData = seriesText ? JSON.parse(seriesText) : [];

        // DEBUG: Mostra no Console (F12) o que chegou
        console.log("📊 Categorias (Eixo Y):", yCategories);
        console.log("📊 Dados (Barras):", seriesData);

        const container = document.getElementById('gantt-container');

        // Trava de Segurança
        if (!yCategories || yCategories.length === 0) {
            container.innerHTML = `
            <div class="flex flex-col items-center justify-center h-full text-gray-500">
                <svg class="w-12 h-12 mb-4 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path></svg>
                <p>Nenhum equipamento cadastrado ou ativo.</p>
                <p class="text-sm">Cadastre um equipamento para gerar o gráfico.</p>
            </div>
        `;
            return;
        }

        // Inicialização do Highcharts Gantt
        try {
            Highcharts.ganttChart('gantt-container', {
                title: { text: '' },
                chart: {
                    style: { fontFamily: 'Inter, sans-serif' },
                    backgroundColor: 'transparent'
                },
                xAxis: {
                    currentDateIndicator: {
                        width: 2,
                        color: 'red',
                        label: { format: 'Agora' }
                    },
                },
                navigator: { enabled: true, liveRedraw: true },
                rangeSelector: {
                    enabled: true,
                    selected: 1,
                    buttons: [
                        { type: 'day', count: 1, text: 'Dia' },
                        { type: 'week', count: 1, text: 'Sem' },
                        { type: 'month', count: 1, text: 'Mês' },
                        { type: 'all', text: 'Tudo' }
                    ]
                },
                yAxis: {
                    type: 'category',
                    grid: { enabled: true, borderColor: 'rgba(0,0,0,0.1)', borderWidth: 1 },
                    categories: yCategories,
                    labels: { style: { fontWeight: 'bold', color: '#374151' } }
                },
                plotOptions: {
                    series: {
                        borderRadius: 4,
                        cursor: 'pointer',
                        point: {
                            events: {
                                click: function () {
                                    if (this.custom && this.custom.analysisId) {
                                        window.location.href = '/analises/' + this.custom.analysisId + '/';
                                    }
                                }
                            }
                        }
                    }
                },
                tooltip: {
                    useHTML: true,
                    formatter: function () {
                        const start = Highcharts.dateFormat('%d/%m %H:%M', this.point.start);
                        const end = Highcharts.dateFormat('%d/%m %H:%M', this.point.end);
                        const custom = this.point.custom;
                        if (!custom) return this.point.name;

                        return `
                        <div style="padding: 8px; max-width: 250px; font-family: sans-serif;">
                            <div style="font-weight: bold; font-size: 14px; margin-bottom: 4px; color: ${this.point.color}">
                                ${this.point.name}
                            </div>
                            <div style="font-size: 12px; margin-bottom: 2px;">
                                <strong>👨‍🔬 Resp:</strong> ${custom.researcher}
                            </div>
                            <div style="font-size: 12px; margin-bottom: 6px;">
                                <strong>📁 Projeto:</strong> ${custom.project}
                            </div>
                            <hr style="margin: 4px 0; border: 0; border-top: 1px solid #eee;" />
                            <div style="font-size: 11px; color: #666;">
                                🕒 ${start} até ${end}
                            </div>
                        </div>
                    `;
                    }
                },
                series: [{
                    name: 'Ocupação',
                    data: seriesData
                }],
                credits: { enabled: false }
            });
        } catch (error) {
            console.error("Erro ao gerar o Highcharts:", error);
        }
    });
</script>
{% endblock %}
